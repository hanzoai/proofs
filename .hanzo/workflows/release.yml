name: Release

# Publishes ghcr.io/hanzoai/proofs, which universe pins and proofs.hanzo.ai
# serves.
#
# The image is built HERE, from this repo's own checkout, rather than by
# POST /v1/runner. That route hands BuildKit a github.com context and clones it
# with no credential; this repo is private on GitHub, so the build dies at
# `[internal] load git source` with "could not read Username" before it ever
# reads the Dockerfile. A checkout on this forge needs no GitHub credential at
# all, which removes the failure rather than working around it.
#
# One arch: the site is a static export served by ghcr.io/hanzoai/static, and
# every node it runs on is amd64.
#
# The Lean corpus is a separate job on its own trigger (proofs.yml) — it takes
# most of an hour and says nothing about whether the site builds.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: [hanzo-build-linux-amd64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/hanzoai/proofs:${{ github.ref_name }}

      - name: The digest universe has to pin
        # The tag is not the pin. universe records tag AND digest together, and
        # a run that only prints a tag leaves the next person to go and ask the
        # registry for the half they actually need.
        run: |
          set -euo pipefail
          d=$(docker buildx imagetools inspect "ghcr.io/hanzoai/proofs:${{ github.ref_name }}" \
                --format '{{ "{{json .Manifest.Digest}}" }}' | tr -d '"')
          echo "ghcr.io/hanzoai/proofs:${{ github.ref_name }}@${d}"
          echo "digest: \`${d}\`" >> "$GITHUB_STEP_SUMMARY"
