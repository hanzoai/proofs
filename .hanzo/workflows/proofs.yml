name: proofs

# Builds the Lean corpus, which nothing did before this file existed.
#
# The repository's other workflows deploy a site and sync a mirror. Neither runs
# a prover, so a theorem that stopped compiling broke no build and "verified"
# meant "written in Lean" — a claim any reader could falsify by cloning and
# running lake build, which is exactly the kind of claim to check ourselves.
#
# The result of this job is allowed to be bad. A red build here is information we
# did not have; a green one is the first evidence that the corpus holds together.

on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - '.hanzo/workflows/proofs.yml'
  workflow_dispatch:

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lake-build:
    runs-on: [hanzo-build-linux-amd64]
    # Mathlib is the long pole even with the cache; a cold run is most of an hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        # The toolchain comes from lean/lean-toolchain, so elan installs no
        # default and lake resolves the pinned version from the project.
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch prebuilt Mathlib
        working-directory: lean
        # Building Mathlib from source is hours; the upstream cache is the
        # difference between a job that runs on every push and one that never does.
        run: lake exe cache get

      - name: lake build
        working-directory: lean
        run: lake build

      - name: Count what the corpus assumes
        # An axiom is an assumption, and a corpus's axiom count is the first
        # number a reader should see — it is the difference between "proved" and
        # "assumed, pending". Printed on every run so the trend is visible rather
        # than rediscovered by an audit.
        if: always()
        working-directory: lean
        run: |
          set -euo pipefail
          ax=$(grep -rc '^axiom' --include='*.lean' . | awk -F: '{s+=$2} END {print s+0}')
          th=$(grep -rc '^theorem\|^lemma' --include='*.lean' . | awk -F: '{s+=$2} END {print s+0}')
          so=$(grep -rc 'sorry' --include='*.lean' . | awk -F: '{s+=$2} END {print s+0}')
          echo "theorems and lemmas: ${th}"
          echo "axioms:              ${ax}"
          echo "sorry:               ${so}"
          {
            echo "### Lean corpus"
            echo ""
            echo "| | count |"
            echo "|---|---:|"
            echo "| theorems and lemmas | ${th} |"
            echo "| axioms | ${ax} |"
            echo "| \`sorry\` | ${so} |"
          } >> "$GITHUB_STEP_SUMMARY"
